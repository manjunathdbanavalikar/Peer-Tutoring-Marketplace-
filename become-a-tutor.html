<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Tutor</title>
</head>
<body>

<header>
    <h1>Peer Tutoring Marketplace</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="tutor.html">Tutor Profile</a>
        <a href="become-a-tutor.html">Become a Tutor</a>
    </nav>
</header>

<main>

    <section>
        <h2>Become a Tutor</h2>
        <p>Join our tutoring platform and help students achieve their academic goals.</p>
    </section>

    <section>
        <h2>Tutor Registration Form</h2>

        <form>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="subject">Subject Expertise:</label><br>
            <input type="text" id="subject" name="subject" required><br><br>

            <label for="experience">Experience:</label><br>
            <textarea id="experience" name="experience" rows="4"></textarea><br><br>

            <button type="submit">Register as Tutor</button>
        </form>
    </section>

</main>

<footer>
    <p>&copy; 2026 Peer Tutoring Marketplace</p>
</footer>

</body>
</html>
